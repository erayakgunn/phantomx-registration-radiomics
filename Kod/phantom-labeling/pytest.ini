[pytest]
# Testler yalnızca tests/ altında. Bu kısıt olmadan pytest
# codes/diagnostic/tilt_direction_test.py gibi teşhis BETİKLERİNİ de test
# sanıyor: dosya adı *_test.py kalıbına uyuyor ve içindeki test_rotation()
# fonksiyonu pytest fixture'ı olmayan argümanlar alıyor.
testpaths = tests

# Varsayılan kalıp "test_*.py *_test.py". İkincisini düşürerek teşhis
# betiklerinin adları yüzünden toplanmasını engelliyoruz.
python_files = test_*.py

markers =
    slow: gerçek veri veya tam bir çalışma gerektirir
